name: collect-feed
on:
  schedule:
    - cron: "17 22,7 * * *" # config/schedule.json と一致すること（07:17・16:17 JST）
  workflow_dispatch: {}
permissions: {}
# 定期実行と手動実行で共通。先の実行が終わってから後の実行が feed の最新を取り出す
concurrency:
  group: feed-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: feed ブランチを取り出す（待ちの後の最新）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feed
          path: feed-root
      - run: npm ci --ignore-scripts
      - name: 収集して feed ブランチの data/ へ push する
        run: node src/cli/run-collect.mjs --feed-root feed-root
        env:
          GITHUB_TOKEN: ${{ github.token }}
