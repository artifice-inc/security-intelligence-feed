# 試験1c: ネットワーク遮断下で実物の固定版 OSV-Scanner による照合が完了することを確認する
name: test-offline
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: node src/cli/install-scanner.mjs --platform linux_amd64 --dest "$RUNNER_TEMP/bin"
      - run: tests/offline/offline-scan.sh "$RUNNER_TEMP/bin/osv-scanner"
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: bash tests/windows/smoke.sh
